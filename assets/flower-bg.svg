<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="sky" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#f6e6d9"/>
      <stop offset="45%" stop-color="#e7c9bd"/>
      <stop offset="100%" stop-color="#a98a85"/>
    </radialGradient>
    <radialGradient id="petalA" cx="40%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#fbe7ea"/>
      <stop offset="55%" stop-color="#e9a9b6"/>
      <stop offset="100%" stop-color="#b96f83"/>
    </radialGradient>
    <radialGradient id="petalB" cx="50%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#fff3d6"/>
      <stop offset="50%" stop-color="#f3d59a"/>
      <stop offset="100%" stop-color="#c99a63"/>
    </radialGradient>
    <radialGradient id="petalC" cx="45%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#fbdde2"/>
      <stop offset="60%" stop-color="#e58fa3"/>
      <stop offset="100%" stop-color="#a4536b"/>
    </radialGradient>
    <radialGradient id="center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7a5a3a"/>
      <stop offset="60%" stop-color="#c9a262"/>
      <stop offset="100%" stop-color="#c9a262" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="verysoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feBlend in2="SourceGraphic" mode="multiply"/>
    </filter>
  </defs>
  <rect width="900" height="1400" fill="url(#sky)"/>
  <!-- background out-of-focus blooms -->
  <g filter="url(#verysoft)" opacity="0.7">
    <ellipse cx="160" cy="260" rx="150" ry="110" fill="#e8b0bb"/>
    <ellipse cx="780" cy="380" rx="170" ry="130" fill="#f1d3a1"/>
    <ellipse cx="120" cy="1150" rx="180" ry="120" fill="#d9a6a8"/>
    <ellipse cx="760" cy="1180" rx="160" ry="140" fill="#8d7a68"/>
    <ellipse cx="450" cy="1320" rx="300" ry="120" fill="#6e5a4f"/>
  </g>
  <!-- stems / leaves -->
  <g filter="url(#soft)" opacity="0.75">
    <path d="M470 760 C 430 900, 420 1100, 400 1400" stroke="#7d8b5a" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M430 1010 C 330 980, 260 1020, 210 1090 C 300 1100, 390 1080, 430 1010 Z" fill="#8a9a63"/>
    <path d="M440 1130 C 520 1100, 610 1130, 660 1200 C 580 1210, 500 1190, 440 1130 Z" fill="#6f8150"/>
  </g>
  <!-- main alstroemeria -->
  <g transform="translate(470 700)" filter="url(#soft)">
    <!-- back petals -->
    <g transform="rotate(-12)">
      <path d="M0 0 C -60 -120, -70 -300, -20 -390 C 30 -300, 60 -120, 0 0 Z" fill="url(#petalA)"/>
    </g>
    <g transform="rotate(115)">
      <path d="M0 0 C -60 -110, -70 -280, -20 -370 C 30 -280, 60 -110, 0 0 Z" fill="url(#petalC)"/>
    </g>
    <g transform="rotate(-130)">
      <path d="M0 0 C -60 -110, -70 -280, -20 -370 C 30 -280, 60 -110, 0 0 Z" fill="url(#petalC)"/>
    </g>
    <!-- front petals (yellow with streaks) -->
    <g transform="rotate(50)">
      <path d="M0 0 C -70 -100, -90 -260, -30 -340 C 40 -260, 70 -100, 0 0 Z" fill="url(#petalB)"/>
      <g stroke="#6b3b2a" stroke-width="3" opacity="0.55" stroke-linecap="round">
        <path d="M-10 -150 l4 -60"/><path d="M8 -170 l3 -70"/><path d="M-22 -190 l3 -50"/><path d="M20 -120 l2 -40"/>
      </g>
    </g>
    <g transform="rotate(-70)">
      <path d="M0 0 C -70 -100, -90 -260, -30 -340 C 40 -260, 70 -100, 0 0 Z" fill="url(#petalB)"/>
      <g stroke="#6b3b2a" stroke-width="3" opacity="0.55" stroke-linecap="round">
        <path d="M-8 -140 l4 -60"/><path d="M10 -175 l3 -70"/><path d="M-20 -200 l3 -50"/>
      </g>
    </g>
    <g transform="rotate(180)">
      <path d="M0 0 C -70 -100, -90 -260, -30 -340 C 40 -260, 70 -100, 0 0 Z" fill="url(#petalA)"/>
    </g>
    <circle r="46" fill="url(#center)"/>
    <g stroke="#5a4030" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M0 0 C 20 -40, 50 -60, 80 -70"/><path d="M0 0 C -30 -35, -60 -50, -85 -50"/>
      <path d="M0 0 C 10 40, 30 70, 60 90"/><path d="M0 0 C -15 40, -40 70, -70 80"/>
    </g>
    <g fill="#3e2a1e">
      <circle cx="80" cy="-70" r="6"/><circle cx="-85" cy="-50" r="6"/><circle cx="60" cy="90" r="6"/><circle cx="-70" cy="80" r="6"/>
    </g>
  </g>
  <!-- second smaller bloom -->
  <g transform="translate(690 300) scale(0.55)" filter="url(#soft)" opacity="0.9">
    <g transform="rotate(20)"><path d="M0 0 C -60 -120, -70 -300, -20 -390 C 30 -300, 60 -120, 0 0 Z" fill="url(#petalA)"/></g>
    <g transform="rotate(140)"><path d="M0 0 C -60 -110, -70 -280, -20 -370 C 30 -280, 60 -110, 0 0 Z" fill="url(#petalC)"/></g>
    <g transform="rotate(-100)"><path d="M0 0 C -60 -110, -70 -280, -20 -370 C 30 -280, 60 -110, 0 0 Z" fill="url(#petalB)"/></g>
    <g transform="rotate(80)"><path d="M0 0 C -70 -100, -90 -260, -30 -340 C 40 -260, 70 -100, 0 0 Z" fill="url(#petalB)"/></g>
    <g transform="rotate(-40)"><path d="M0 0 C -70 -100, -90 -260, -30 -340 C 40 -260, 70 -100, 0 0 Z" fill="url(#petalA)"/></g>
    <circle r="40" fill="url(#center)"/>
  </g>
  <rect width="900" height="1400" filter="url(#grain)" fill="#fff" opacity="0.35"/>
</svg>
