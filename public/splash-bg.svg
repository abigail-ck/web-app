<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="petal" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#F2B9BE"/>
      <stop offset="60%" stop-color="#EBB6BC" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#EBB6BC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heart" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9B48E"/>
      <stop offset="100%" stop-color="#C9B48E" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feBlend in2="SourceGraphic" mode="multiply"/>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="#F4F0E6"/>
  <g filter="url(#blur)">
    <ellipse cx="300" cy="300" rx="70" ry="220" transform="rotate(-25 300 300)" fill="url(#petal)"/>
    <ellipse cx="180" cy="420" rx="70" ry="200" transform="rotate(60 180 420)" fill="url(#petal)"/>
    <ellipse cx="520" cy="250" rx="70" ry="210" transform="rotate(35 520 250)" fill="url(#petal)"/>
    <ellipse cx="560" cy="470" rx="70" ry="200" transform="rotate(-70 560 470)" fill="url(#petal)"/>
    <ellipse cx="380" cy="520" rx="80" ry="190" transform="rotate(10 380 520)" fill="url(#petal)"/>
    <circle cx="330" cy="440" r="70" fill="url(#heart)"/>
    <ellipse cx="640" cy="880" rx="140" ry="260" transform="rotate(-30 640 880)" fill="url(#petal)"/>
    <ellipse cx="420" cy="960" rx="120" ry="220" transform="rotate(20 420 960)" fill="url(#petal)"/>
  </g>
  <rect width="800" height="1000" filter="url(#grain)" fill="#fff" opacity=".5"/>
</svg>
